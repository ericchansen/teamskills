name: CI/CD Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-check
          level: info
          fail_level: error
          actionlint_flags: -shellcheck=""

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint backend
        run: npm run lint
        continue-on-error: false

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend
        continue-on-error: false

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teamskills_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run backend tests
        run: npm run test:backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/teamskills_test
          NODE_ENV: test

      - name: Run frontend tests
        run: npm run test
        working-directory: frontend

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [test, actionlint]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    environment: production
    permissions:
      id-token: write
      contents: read
    
    # Deploy using direct Azure CLI instead of azd.
    # Reason: Production infrastructure is brownfield (created incrementally, not by azd).
    # azd provision generates a resourceToken from AZURE_ENV_NAME that creates NEW resources
    # instead of updating existing ones. Direct CLI targets the exact existing resources.
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure CLI
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push backend image
        run: |
          az acr build \
            --registry ${{ vars.ACR_NAME || 'crgvojq4dgzbtk4' }} \
            --image backend:${{ github.sha }} \
            --image backend:latest \
            --file Dockerfile.backend \
            .

      - name: Build and push agent image
        run: |
          az acr build \
            --registry ${{ vars.ACR_NAME || 'crgvojq4dgzbtk4' }} \
            --image agent:${{ github.sha }} \
            --image agent:latest \
            --file Dockerfile.agent \
            .

      - name: Build and push frontend image
        run: |
          BACKEND_URL="https://$(az containerapp show \
            --name ${{ vars.BACKEND_APP || 'ca-backend-gvojq4dgzbtk4' }} \
            --resource-group ${{ vars.RESOURCE_GROUP || 'rg-teamskills-prod' }} \
            --query 'properties.configuration.ingress.fqdn' -o tsv)"

          AGENT_URL="https://$(az containerapp show \
            --name ${{ vars.AGENT_APP || 'ca-agent-gvojq4dgzbtk4' }} \
            --resource-group ${{ vars.RESOURCE_GROUP || 'rg-teamskills-prod' }} \
            --query 'properties.configuration.ingress.fqdn' -o tsv)"

          az acr build \
            --registry ${{ vars.ACR_NAME || 'crgvojq4dgzbtk4' }} \
            --image frontend:${{ github.sha }} \
            --image frontend:latest \
            --file Dockerfile.frontend \
            --build-arg VITE_API_URL=$BACKEND_URL \
            --build-arg VITE_AZURE_AD_CLIENT_ID=${{ vars.AZURE_AD_CLIENT_ID }} \
            --build-arg VITE_AZURE_AD_TENANT_ID=${{ vars.AZURE_AD_TENANT_ID }} \
            --build-arg VITE_AGENT_URL=$AGENT_URL \
            .

      - name: Deploy backend
        run: |
          APP="${{ vars.BACKEND_APP || 'ca-backend-gvojq4dgzbtk4' }}"
          RG="${{ vars.RESOURCE_GROUP || 'rg-teamskills-prod' }}"
          IMAGE="${{ vars.ACR_NAME || 'crgvojq4dgzbtk4' }}.azurecr.io/backend:${{ github.sha }}"

          ENV_VARS="AZURE_AD_CLIENT_ID=${{ vars.AZURE_AD_CLIENT_ID }} \
            AZURE_AD_TENANT_ID=${{ vars.AZURE_AD_TENANT_ID }} \
            NODE_ENV=production"

          # Set INIT_SECRET as a Container Apps secret (separate command per Azure CLI docs)
          if [ -n "$INIT_SECRET" ]; then
            az containerapp secret set \
              --name "$APP" \
              --resource-group "$RG" \
              --secrets "init-secret=$INIT_SECRET"
            ENV_VARS="$ENV_VARS INIT_SECRET=secretref:init-secret"
          fi

          # ENV_VARS needs word splitting for multiple env var args
          # shellcheck disable=SC2086
          az containerapp update \
            --name "$APP" \
            --resource-group "$RG" \
            --image "$IMAGE" \
            --set-env-vars $ENV_VARS
        env:
          INIT_SECRET: ${{ secrets.INIT_SECRET }}

      - name: Deploy agent
        run: |
          az containerapp update \
            --name ${{ vars.AGENT_APP || 'ca-agent-gvojq4dgzbtk4' }} \
            --resource-group ${{ vars.RESOURCE_GROUP || 'rg-teamskills-prod' }} \
            --image ${{ vars.ACR_NAME || 'crgvojq4dgzbtk4' }}.azurecr.io/agent:${{ github.sha }}

      - name: Deploy frontend
        run: |
          RG="${{ vars.RESOURCE_GROUP || 'rg-teamskills-prod' }}"

          BACKEND_FQDN="$(az containerapp show \
            --name ${{ vars.BACKEND_APP || 'ca-backend-gvojq4dgzbtk4' }} \
            --resource-group "$RG" \
            --query 'properties.configuration.ingress.fqdn' -o tsv)"
          API_URL="https://${BACKEND_FQDN}"

          AGENT_URL="https://$(az containerapp show \
            --name ${{ vars.AGENT_APP || 'ca-agent-gvojq4dgzbtk4' }} \
            --resource-group "$RG" \
            --query 'properties.configuration.ingress.fqdn' -o tsv)"

          # --set-env-vars REPLACES all env vars — must include every var the container needs
          az containerapp update \
            --name ${{ vars.FRONTEND_APP || 'ca-frontend-teamskills' }} \
            --resource-group "$RG" \
            --image ${{ vars.ACR_NAME || 'crgvojq4dgzbtk4' }}.azurecr.io/frontend:${{ github.sha }} \
            --set-env-vars \
              VITE_API_URL=$API_URL \
              VITE_AZURE_AD_CLIENT_ID=${{ vars.AZURE_AD_CLIENT_ID }} \
              VITE_AZURE_AD_TENANT_ID=${{ vars.AZURE_AD_TENANT_ID }} \
              VITE_AGENT_URL=$AGENT_URL

      - name: Wait for new revisions to provision
        run: |
          RG="${{ vars.RESOURCE_GROUP || 'rg-teamskills-prod' }}"
          EXPECTED_SHA="${{ github.sha }}"
          BACKEND_APP="${{ vars.BACKEND_APP || 'ca-backend-gvojq4dgzbtk4' }}"
          AGENT_APP="${{ vars.AGENT_APP || 'ca-agent-gvojq4dgzbtk4' }}"
          FRONTEND_APP="${{ vars.FRONTEND_APP || 'ca-frontend-teamskills' }}"

          BACKEND_URL="https://$(az containerapp show -n "$BACKEND_APP" -g "$RG" --query 'properties.configuration.ingress.fqdn' -o tsv)"
          AGENT_URL="https://$(az containerapp show -n "$AGENT_APP" -g "$RG" --query 'properties.configuration.ingress.fqdn' -o tsv)"

          # Wait for all three container apps to activate the new image SHA
          echo "Waiting for revisions with image SHA ${EXPECTED_SHA:0:12}..."
          for APP_PAIR in \
            "backend:${BACKEND_APP}" \
            "agent:${AGENT_APP}" \
            "frontend:${FRONTEND_APP}"; do
            LABEL="${APP_PAIR%%:*}"
            APP="${APP_PAIR#*:}"
            echo "Waiting for $LABEL..."
            READY=false
            for i in $(seq 1 36); do
              ACTIVE_IMAGE="$(az containerapp revision list -n "$APP" -g "$RG" \
                --query "[?properties.active].properties.template.containers[0].image | [0]" \
                -o tsv 2>/dev/null || echo 'unknown')"
              if echo "$ACTIVE_IMAGE" | grep -q ":${EXPECTED_SHA}$"; then
                echo "  ✅ $LABEL running expected image (attempt $i)"
                READY=true
                break
              fi
              echo "  Attempt $i/36: $LABEL still on old image, waiting 10s..."
              sleep 10
            done
            if [ "$READY" != "true" ]; then
              echo "  ❌ $LABEL did not activate expected image after 6 minutes"
              exit 1
            fi
          done

          # Now verify backend health with the new revision
          echo "Verifying backend health..."
          BACKEND_HEALTHY=false
          for i in $(seq 1 12); do
            if curl -sf "${BACKEND_URL}/health/ready" | grep -q '"status":"ok"'; then
              echo "✅ Backend is ready (schema validated)!"
              BACKEND_HEALTHY=true
              break
            fi
            echo "Attempt $i/12: Backend not healthy yet, waiting 10s..."
            sleep 10
          done
          if [ "$BACKEND_HEALTHY" != "true" ]; then
            echo "❌ Backend failed health check after new revision activated"
            exit 1
          fi

          # Agent health is non-blocking
          echo "Checking agent health..."
          AGENT_READY=false
          for i in $(seq 1 6); do
            if curl -sf "${AGENT_URL}/health" | grep -q '"healthy"'; then
              echo "✅ Agent is ready!"
              AGENT_READY=true
              break
            fi
            echo "Attempt $i/6: Agent not ready yet, waiting 10s..."
            sleep 10
          done
          if [ "$AGENT_READY" != "true" ]; then
            echo "⚠️ Agent failed to become ready (non-blocking)"
          fi

      - name: Verify deployed image SHAs
        run: |
          RG="${{ vars.RESOURCE_GROUP || 'rg-teamskills-prod' }}"
          EXPECTED_SHA="${{ github.sha }}"
          ALL_OK=true

          for APP_PAIR in \
            "backend:${{ vars.BACKEND_APP || 'ca-backend-gvojq4dgzbtk4' }}" \
            "agent:${{ vars.AGENT_APP || 'ca-agent-gvojq4dgzbtk4' }}" \
            "frontend:${{ vars.FRONTEND_APP || 'ca-frontend-teamskills' }}"; do
            LABEL="${APP_PAIR%%:*}"
            APP="${APP_PAIR#*:}"
            ACTIVE_IMAGE="$(az containerapp revision list -n "$APP" -g "$RG" \
              --query "[?properties.active].properties.template.containers[0].image | [0]" \
              -o tsv 2>/dev/null || echo 'unknown')"
            echo "$LABEL active revision: $ACTIVE_IMAGE"
            if echo "$ACTIVE_IMAGE" | grep -q ":${EXPECTED_SHA}$"; then
              echo "  ✅ matches expected SHA"
            else
              echo "  ⚠️ expected SHA $EXPECTED_SHA but got: $ACTIVE_IMAGE"
              ALL_OK=false
            fi
          done

          if [ "$ALL_OK" != "true" ]; then
            echo "❌ One or more active revisions do not match expected image!"
            exit 1
          fi
          echo "✅ All active revisions running expected image SHA"

      - name: Initialize database (seed schema + skills)
        run: |
          if [ -z "$INIT_SECRET" ]; then
            echo "⚠️ INIT_SECRET not configured — skipping database init"
            exit 0
          fi

          RG="${{ vars.RESOURCE_GROUP || 'rg-teamskills-prod' }}"
          BACKEND_APP="${{ vars.BACKEND_APP || 'ca-backend-gvojq4dgzbtk4' }}"
          BACKEND_URL="https://$(az containerapp show -n "$BACKEND_APP" -g "$RG" --query 'properties.configuration.ingress.fqdn' -o tsv)"

          echo "Calling ${BACKEND_URL}/api/admin/init ..."
          INIT_RESPONSE=$(curl -sf -X POST "${BACKEND_URL}/api/admin/init" \
            -H 'Content-Type: application/json' \
            -d "{\"secret\":\"${INIT_SECRET}\"}" \
            || echo '{"error":"curl failed"}')
          echo "Init response: ${INIT_RESPONSE}"

          if echo "$INIT_RESPONSE" | grep -q '"status":"skipped"'; then
            echo "✅ Database already seeded — nothing to do"
          elif echo "$INIT_RESPONSE" | grep -q '"status":"success"'; then
            echo "✅ Database initialized and seeded"
          else
            echo "❌ Database init failed!"
            exit 1
          fi
        env:
          INIT_SECRET: ${{ secrets.INIT_SECRET }}

      - name: Smoke test - Validate auth configuration
        run: |
          RG="${{ vars.RESOURCE_GROUP || 'rg-teamskills-prod' }}"
          BACKEND_APP="${{ vars.BACKEND_APP || 'ca-backend-gvojq4dgzbtk4' }}"
          FRONTEND_APP="${{ vars.FRONTEND_APP || 'ca-frontend-teamskills' }}"
          AGENT_APP="${{ vars.AGENT_APP || 'ca-agent-gvojq4dgzbtk4' }}"

          BACKEND_URL="https://$(az containerapp show -n "$BACKEND_APP" -g "$RG" --query 'properties.configuration.ingress.fqdn' -o tsv)"
          FRONTEND_URL="https://$(az containerapp show -n "$FRONTEND_APP" -g "$RG" --query 'properties.configuration.ingress.fqdn' -o tsv)"
          AGENT_URL="https://$(az containerapp show -n "$AGENT_APP" -g "$RG" --query 'properties.configuration.ingress.fqdn' -o tsv)"

          echo "Frontend: $FRONTEND_URL"
          echo "Backend: $BACKEND_URL"

          echo "=== Smoke Test: Health Check ==="
          HEALTH=$(curl -sf "${BACKEND_URL}/health" || echo '{"status":"unreachable"}')
          echo "Health: ${HEALTH}"
          if ! echo "$HEALTH" | grep -q '"ok"'; then
            echo "❌ Backend health check failed!"
            exit 1
          fi

          echo "=== Smoke Test: Schema Readiness ==="
          READY_HTTP=$(curl -s -o /tmp/ready.json -w '%{http_code}' "${BACKEND_URL}/health/ready")
          READY=$(cat /tmp/ready.json 2>/dev/null || echo '{"status":"unreachable"}')
          echo "Ready (HTTP ${READY_HTTP}): ${READY}"
          if echo "$READY" | grep -q '"schema_outdated"'; then
            echo "❌ Database schema is outdated — migrations did not run!"
            exit 1
          fi
          if [ "$READY_HTTP" != "200" ]; then
            echo "❌ Readiness check failed (HTTP ${READY_HTTP})!"
            exit 1
          fi

          echo "=== Smoke Test: Auth Config ==="
          AUTH_CONFIG=$(curl -sf "${BACKEND_URL}/api/auth/config" || echo "{}")
          echo "Auth config: ${AUTH_CONFIG}"

          if ! echo "$AUTH_CONFIG" | grep -q '"clientId"'; then
            echo "❌ Auth config missing clientId!"
            exit 1
          fi

          if ! echo "$AUTH_CONFIG" | grep -q '"tenantId"'; then
            echo "❌ Auth config missing tenantId!"
            exit 1
          fi

          echo "=== Smoke Test: Frontend Config ==="
          CONFIG=$(curl -sf "${FRONTEND_URL}/config.js" || echo "")
          echo "config.js: ${CONFIG}"

          if echo "$CONFIG" | grep -q 'VITE_AZURE_AD_CLIENT_ID: ""'; then
            echo "❌ VITE_AZURE_AD_CLIENT_ID is empty!"
            exit 1
          fi

          if echo "$CONFIG" | grep -q 'VITE_AZURE_AD_TENANT_ID: ""'; then
            echo "❌ VITE_AZURE_AD_TENANT_ID is empty!"
            exit 1
          fi

          echo "✅ Auth configuration verified!"

          echo "=== Smoke Test: Agent Health ==="
          AGENT_HEALTH=$(curl -sf "${AGENT_URL}/health" || echo '{"status":"unreachable"}')
          echo "Agent health: ${AGENT_HEALTH}"
          if ! echo "$AGENT_HEALTH" | grep -q '"healthy"'; then
            echo "⚠️ Agent health check failed (non-blocking)"
          else
            echo "✅ Agent is healthy!"
          fi

          echo "FRONTEND_URL=$FRONTEND_URL" >> $GITHUB_ENV
          echo "BACKEND_URL=$BACKEND_URL" >> $GITHUB_ENV
          echo "AGENT_URL=$AGENT_URL" >> $GITHUB_ENV

      - name: Deployment summary
        run: |
          echo "## Deployment Complete! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend:** ${{ env.FRONTEND_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "**Backend:** ${{ env.BACKEND_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "**Agent:** ${{ env.AGENT_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Method:** Direct Azure CLI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### GitHub Variables (override defaults via repo settings)" >> $GITHUB_STEP_SUMMARY
          echo "| Variable | Default |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`RESOURCE_GROUP\` | \`rg-teamskills-prod\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`ACR_NAME\` | \`crgvojq4dgzbtk4\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`BACKEND_APP\` | \`ca-backend-gvojq4dgzbtk4\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`FRONTEND_APP\` | \`ca-frontend-teamskills\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`AGENT_APP\` | \`ca-agent-gvojq4dgzbtk4\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`PG_SERVER_NAME\` | \`psql-gvojq4dgzbtk4\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`RESOURCE_TOKEN\` | \`gvojq4dgzbtk4\` |" >> $GITHUB_STEP_SUMMARY
